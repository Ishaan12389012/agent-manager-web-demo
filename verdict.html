// ===== Rendering engine for the standalone page =====
// The screens are written as HTML with four small additions:
//   {{ path }}                         a value from the app's view-model (dotted path, no expressions)
//   <sc-for list="{{ items }}" as="x">  repeat the inside once per item
//   <sc-if value="{{ flag }}">          render the inside only when the value is truthy
//   onClick / onChange / onSubmit / onFocus / onKeyDown = "{{ handler }}"
// Each update re-renders the markup and patches it into the live page, so typing, focus and scroll survive.

const VOID_TAGS = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'source', 'track', 'wbr']);
const EVENT_NAMES = { onClick: 'click', onSubmit: 'submit', onFocus: 'focusin', onKeyDown: 'keydown', onChange: 'change', onInput: 'input' };
const HOLE_RE = /\{\{\s*([^}]+?)\s*\}\}/g;

function parseTemplate(src) {
  const root = { tag: '#root', attrs: [], children: [] };
  const stack = [root];
  const re = /<!--[\s\S]*?-->|<\/([a-zA-Z][\w-]*)\s*>|<([a-zA-Z][\w-]*)((?:\s+[^\s=>\/]+(?:="[^"]*"|='[^']*')?)*)\s*(\/?)>|([^<]+)/g;
  let m;
  while ((m = re.exec(src))) {
    if (m[0].startsWith('<!--')) continue;
    if (m[1]) {
      for (let i = stack.length - 1; i > 0; i--) if (stack[i].tag === m[1]) { stack.length = i; break; }
      continue;
    }
    if (m[2]) {
      const attrs = [];
      const ar = /([^\s=]+)(?:="([^"]*)"|='([^']*)')?/g;
      let a;
      while ((a = ar.exec(m[3] || ''))) attrs.push([a[1], a[2] !== undefined ? a[2] : a[3] !== undefined ? a[3] : null]);
      const node = { tag: m[2], attrs, children: [] };
      stack[stack.length - 1].children.push(node);
      if (!VOID_TAGS.has(m[2].toLowerCase()) && !m[4]) stack.push(node);
      continue;
    }
    if (m[5]) stack[stack.length - 1].children.push({ text: m[5] });
  }
  return root;
}

function splitHoles(s) {
  const parts = [];
  let last = 0, m;
  HOLE_RE.lastIndex = 0;
  while ((m = HOLE_RE.exec(s))) {
    if (m.index > last) parts.push(s.slice(last, m.index));
    parts.push({ p: m[1] });
    last = HOLE_RE.lastIndex;
  }
  if (last < s.length) parts.push(s.slice(last));
  return parts;
}

function holePath(v) { const m = /^\{\{\s*([^}]+?)\s*\}\}$/.exec(v || ''); return m ? m[1] : null; }

function compileTemplate(node) {
  if (node.text !== undefined) { node.parts = splitHoles(node.text); return node; }
  if (node.tag === 'sc-for') {
    node.listPath = holePath((node.attrs.find((a) => a[0] === 'list') || [])[1]);
    node.as = (node.attrs.find((a) => a[0] === 'as') || [])[1];
  } else if (node.tag === 'sc-if') {
    node.valuePath = holePath((node.attrs.find((a) => a[0] === 'value') || [])[1]);
  } else {
    node.cattrs = node.attrs.map(([name, value]) => {
      if (/^hint-/.test(name)) return { name, drop: true };
      if (/^on[A-Z]/.test(name)) return { name, event: EVENT_NAMES[name] || name.slice(2).toLowerCase(), path: holePath(value) };
      if (value != null && value.indexOf('{{') >= 0) {
        const parts = splitHoles(value);
        return { name, parts, whole: parts.length === 1 && typeof parts[0] !== 'string' };
      }
      return { name, value };
    });
  }
  (node.children || []).forEach(compileTemplate);
  return node;
}

function lookup(path, scope) {
  if (path === 'true') return true;
  if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
  const segs = path.split('.');
  for (let i = scope.length - 1; i >= 0; i--) {
    const frame = scope[i];
    if (frame && Object.prototype.hasOwnProperty.call(frame, segs[0])) {
      let v = frame[segs[0]];
      for (let k = 1; k < segs.length; k++) { if (v == null) return undefined; v = v[segs[k]]; }
      return v;
    }
  }
  return undefined;
}

const escHtml = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

let handlers = [];
let selectContext = null;

function renderNodes(nodes, scope, out) { for (let i = 0; i < nodes.length; i++) renderNode(nodes[i], scope, out); }

function renderNode(n, scope, out) {
  if (n.text !== undefined) {
    for (const p of n.parts) out.push(typeof p === 'string' ? p : escHtml(lookup(p.p, scope)));
    return;
  }
  if (n.tag === 'sc-for') {
    const list = n.listPath ? lookup(n.listPath, scope) : null;
    out.push('<sc-for>');
    if (Array.isArray(list)) list.forEach((item, i) => { const frame = { $index: i }; frame[n.as] = item; renderNodes(n.children, scope.concat([frame]), out); });
    out.push('</sc-for>');
    return;
  }
  if (n.tag === 'sc-if') {
    out.push('<sc-if>');
    if (n.valuePath && lookup(n.valuePath, scope)) renderNodes(n.children, scope, out);
    out.push('</sc-if>');
    return;
  }
  if (n.tag === 'helmet') return;
  let attrs = '', selectValue = null, textValue = null;
  for (const a of n.cattrs) {
    if (a.drop) continue;
    if (a.event) {
      const fn = a.path ? lookup(a.path, scope) : null;
      if (typeof fn === 'function') {
        let ev = a.event;
        if (ev === 'change' && (n.tag === 'input' || n.tag === 'textarea')) ev = 'input';
        attrs += ` data-on-${ev}="${handlers.push(fn) - 1}"`;
      }
      continue;
    }
    let html, raw;
    if (a.whole) {
      raw = lookup(a.parts[0].p, scope);
      if (raw === undefined || raw === null || raw === false) continue;
      html = raw === true ? '' : escHtml(raw);
    } else if (a.parts) {
      html = a.parts.map((p) => (typeof p === 'string' ? p : escHtml(lookup(p.p, scope)))).join('');
    } else {
      html = a.value;
    }
    if (a.name === 'value' && n.tag === 'select') { selectValue = raw !== undefined ? String(raw) : html; continue; }
    if (a.name === 'value' && n.tag === 'textarea') { textValue = raw !== undefined ? String(raw) : html; continue; }
    attrs += html === null ? ` ${a.name}` : ` ${a.name}="${html}"`;
  }
  if (n.tag === 'option' && selectContext !== null) {
    const ov = (n.attrs.find((x) => x[0] === 'value') || [])[1];
    if (ov === selectContext) attrs += ' selected';
  }
  if (n.tag === 'select' && selectValue !== null) attrs += ` data-value="${escHtml(selectValue)}"`;
  out.push(`<${n.tag}${attrs}>`);
  if (VOID_TAGS.has(n.tag)) return;
  if (n.tag === 'textarea') { out.push(escHtml(textValue || '')); out.push('</textarea>'); return; }
  const prevSelect = selectContext;
  if (n.tag === 'select') selectContext = selectValue;
  renderNodes(n.children, scope, out);
  selectContext = prevSelect;
  out.push(`</${n.tag}>`);
}

// ---- patch new markup into the live DOM (keeps focused inputs and scroll positions) ----
function morphChildren(fromParent, toParent) {
  const from = Array.prototype.slice.call(fromParent.childNodes);
  const to = Array.prototype.slice.call(toParent.childNodes);
  for (let i = 0; i < to.length; i++) {
    if (i < from.length) morphNode(from[i], to[i]);
    else fromParent.appendChild(document.importNode(to[i], true));
  }
  for (let i = from.length - 1; i >= to.length; i--) fromParent.removeChild(from[i]);
}

function morphNode(f, t) {
  if (f.nodeType !== t.nodeType || f.nodeName !== t.nodeName || (f.nodeType === 1 && f.namespaceURI !== t.namespaceURI)) {
    f.parentNode.replaceChild(document.importNode(t, true), f);
    return;
  }
  if (f.nodeType !== 1) { if (f.nodeValue !== t.nodeValue) f.nodeValue = t.nodeValue; return; }
  const fa = f.attributes, ta = t.attributes;
  for (let i = fa.length - 1; i >= 0; i--) { const name = fa[i].name; if (!t.hasAttribute(name)) f.removeAttribute(name); }
  for (let i = 0; i < ta.length; i++) { const { name, value } = ta[i]; if (f.getAttribute(name) !== value) f.setAttribute(name, value); }
  const tag = f.nodeName;
  if (tag === 'TEXTAREA') { const v = t.textContent; if (f.value !== v) f.value = v; return; }
  if (tag === 'INPUT') { if (t.hasAttribute('value')) { const v = t.getAttribute('value'); if (f.value !== v) f.value = v; } return; }
  morphChildren(f, t);
  if (tag === 'SELECT') { const v = t.getAttribute('data-value'); if (v !== null && f.value !== v) f.value = v; }
}

// ---- event delegation: one listener per event type, routed to the handler named on the element ----
function installEvents() {
  ['click', 'input', 'change', 'submit', 'focusin', 'keydown'].forEach((type) => {
    document.addEventListener(type, (e) => {
      let el = e.target;
      while (el && el !== document) {
        if (el.nodeType === 1 && el.hasAttribute('data-on-' + type)) {
          const fn = handlers[+el.getAttribute('data-on-' + type)];
          if (type === 'submit') e.preventDefault();
          if (fn) fn(e);
          return;
        }
        el = el.parentNode;
      }
    }, type === 'focusin');
  });
}


// ---- boot: mount the app full-screen and keep the address bar in step (back/forward and deep links work) ----
function boot() {
  const SCREEN_TITLES = { home: 'Home', projects: 'Projects', departments: 'Departments', attention: 'Needs attention', ask: 'Ask Verdict', settings: 'Settings' };
  const routeFromHash = () => {
    const m = /^#\/([a-z]+)(?:\/([\w-]+))?/.exec(window.location.hash || '');
    if (!m) return null;
    if (m[1] === 'project') return m[2] ? { screen: 'project', toolId: m[2] } : null;
    return SCREENS.indexOf(m[1]) >= 0 ? { screen: m[1] } : null;
  };
  const hashFor = (s) => (s.screen === 'project' ? `#/project/${s.toolId}` : `#/${s.screen}`);

  const tree = compileTemplate(parseTemplate(document.getElementById('vd-template').textContent));
  const root = document.getElementById('app');
  const initial = routeFromHash();
  const app = new Component({ start: initial ? initial.screen : 'home' });
  if (initial && initial.toolId && TOOLS.some((t) => t.id === initial.toolId)) app.state.toolId = initial.toolId;

  const baseNav = app.nav.bind(app);
  app.nav = function (screen, extra) {
    baseNav(screen, extra);
    const h = hashFor(app.state);
    if (window.location.hash !== h) window.location.hash = h;
  };
  window.addEventListener('hashchange', () => {
    if (window.location.hash === hashFor(app.state)) return;
    const r = routeFromHash();
    if (r) baseNav(r.screen, r.toolId ? { toolId: r.toolId } : {});
  });

  let queued = false;
  const paint = () => {
    queued = false;
    handlers = [];
    const vals = app.renderVals();
    const out = [];
    renderNodes(tree.children, [vals], out);
    const t = document.createElement('template');
    t.innerHTML = out.join('');
    morphChildren(root, t.content);
    const s = app.state;
    document.title = 'Verdict · ' + (s.screen === 'project' ? vals.pd.name : SCREEN_TITLES[s.screen] || 'Home');
    if (typeof app.componentDidUpdate === 'function') app.componentDidUpdate();
  };
  requestRender = () => { if (!queued) { queued = true; Promise.resolve().then(paint); } };
  installEvents();
  paint();
  window.verdictApp = app; // handy for poking at the prototype from the browser console
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
</body>
