<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdict</title>
<meta name="description" content="Verdict — see what every AI tool and agent in the company costs, returns and needs from you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;display=swap">
<style>
body{margin:0;background:#f4f6f9}
*,*::before,*::after{box-sizing:border-box}
sc-for,sc-if{display:contents}
.vd button,.vd input,.vd select,.vd textarea{font-family:inherit}
.vd input::placeholder,.vd textarea::placeholder{color:#7b8698}
.vd .hov:hover{background:#f5f7fa !important}
.vd .lift{transition:box-shadow .15s ease,transform .15s ease}
.vd .lift:hover{box-shadow:0 10px 28px rgba(15,23,42,.09) !important;transform:translateY(-1px)}
.vd .nv:hover{background:rgba(255,255,255,.07) !important;color:#ffffff !important}
.vd .btn-p:hover{background:#1d4ed8 !important}
.vd .btn-s:hover{background:#f5f7fa !important;border-color:#cbd3de !important}
.vd .btn-o:hover{background:#eef4ff !important}
.vd .btn-d:hover{background:#22314d !important}
.vd .btn-g:hover{background:rgba(255,255,255,.14) !important}
.vd .lnk:hover{text-decoration:underline}
.vd .ptab-wrap{min-width:880px}
.vd .ptab{display:grid;grid-template-columns:minmax(180px,2fr) 136px minmax(140px,1.5fr) 56px 84px 74px 64px 16px;column-gap:10px;align-items:center}
@media (max-width:1600px){.vd .ptab{grid-template-columns:minmax(170px,2fr) 126px minmax(130px,1.5fr) 52px 80px 70px 16px}.vd .ptab-wrap{min-width:760px}.vd .pt-upd{display:none !important}}
.vd button:focus-visible,.vd input:focus-visible,.vd select:focus-visible,.vd textarea:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}
.vd .fw:focus-within{border-color:#2563eb !important;box-shadow:0 0 0 3px rgba(37,99,235,.16) !important}
.vd .fade{animation:vdFade .28s ease-out both}
.vd .pop{animation:vdPop .2s ease-out both}
.vd .slide{animation:vdSlide .22s ease-out both}
.vd .dot1,.vd .dot2,.vd .dot3{animation:vdDot 1.2s infinite ease-in-out}
.vd .dot2{animation-delay:.15s}
.vd .dot3{animation-delay:.3s}
@keyframes vdFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes vdPop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes vdSlide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes vdDot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.vd .fade,.vd .pop,.vd .slide,.vd .lift{animation:none;transition:none}}
@media (max-width:1280px){.vd .c2-lg{grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important}.vd .span-lg{grid-column:1 / -1}}
@media (max-width:1100px){.vd .c1-xl{grid-template-columns:minmax(0,1fr) !important}}
@media (max-width:960px){.vd .side{display:none !important}.vd .main{margin-left:0 !important}.vd .mtop{display:flex !important}.vd .c1-md{grid-template-columns:minmax(0,1fr) !important}.vd .hide-md{display:none !important}}
@media (max-width:640px){.vd .pad{padding-left:16px !important;padding-right:16px !important}.vd .h1{font-size:26px !important}.vd .hide-sm{display:none !important}.vd .c2-lg{grid-template-columns:minmax(0,1fr) !important}.vd .full-sm{width:100% !important}.vd .stack-sm{flex-direction:column !important;align-items:stretch !important}.vd .srch{order:3;flex-basis:100% !important;max-width:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family:system-ui, sans-serif; padding:24px">Verdict needs JavaScript turned on.</p></noscript>

<!-- Screens: HTML with {{ value }} holes, <sc-for> loops and <sc-if> conditions, rendered by the engine at the bottom of the page. -->
<script type="text/x-template" id="vd-template">
<div class="vd" style="min-height:100vh; background:#f4f6f9; font-family:'Lato', system-ui, -apple-system, 'Segoe UI', sans-serif; color:#0f172a; font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased">

<aside class="side" aria-label="Sidebar" style="position:fixed; top:0; left:0; bottom:0; width:248px; background:#0f1b2d; color:#c9d2df; display:flex; flex-direction:column; gap:6px; padding:26px 16px 22px; z-index:30">
<button onClick="{{ go.home }}" aria-label="Verdict home" style="display:flex; align-items:center; gap:12px; padding:0 10px 26px; border:0; background:none; color:#ffffff; font:inherit; cursor:pointer; text-align:left">
<span style="width:40px; height:40px; border-radius:11px; background:#2f6bef; display:inline-flex; align-items:center; justify-content:center; flex:none"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ ic.sparkle }}" style="fill:#ffffff"></path></svg></span>
<span style="font-size:27px; font-weight:700; letter-spacing:-0.01em">Verdict</span>
</button>
<nav aria-label="Main" style="display:flex; flex-direction:column; gap:6px">
<sc-for list="{{ navMain }}" as="n" hint-placeholder-count="4">
<button class="{{ n.cls }}" onClick="{{ n.click }}" aria-current="{{ n.current }}" style="display:flex; align-items:center; gap:12px; min-height:48px; padding:0 12px; white-space:nowrap; border:0; border-radius:12px; background:{{ n.bg }}; color:{{ n.fg }}; font:inherit; font-size:16px; font-weight:{{ n.weight }}; cursor:pointer; text-align:left">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; color:{{ n.iconColor }}"><path d="{{ n.icon }}"></path></svg>
<span style="flex:1">{{ n.label }}</span>
<sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width:24px; height:24px; padding:0 7px; border-radius:999px; background:#e5484d; color:#ffffff; font-size:13px; font-weight:700; display:inline-flex; align-items:center; justify-content:center">{{ n.badge }}</span></sc-if>
</button>
</sc-for>
</nav>
<div style="height:1px; background:rgba(255,255,255,0.1); margin:14px 10px"></div>
<nav aria-label="Assistant and settings" style="display:flex; flex-direction:column; gap:6px">
<sc-for list="{{ navSub }}" as="n" hint-placeholder-count="2">
<button class="{{ n.cls }}" onClick="{{ n.click }}" aria-current="{{ n.current }}" style="display:flex; align-items:center; gap:12px; min-height:48px; padding:0 12px; white-space:nowrap; border:0; border-radius:12px; background:{{ n.bg }}; color:{{ n.fg }}; font:inherit; font-size:16px; font-weight:{{ n.weight }}; cursor:pointer; text-align:left">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; color:{{ n.iconColor }}"><path d="{{ n.icon }}"></path></svg>
<span style="flex:1">{{ n.label }}</span>
</button>
</sc-for>
</nav>
<div style="margin-top:auto; display:flex; gap:10px; align-items:flex-start; padding:0 12px; font-size:13px; line-height:1.5; color:#97a3b6">
<span style="width:9px; height:9px; margin-top:5px; border-radius:50%; background:#22c55e; flex:none"></span>
<span>Data last updated<br>14 Sep 2026, 09:00</span>
</div>
</aside>

<div class="main" style="margin-left:248px; min-height:100vh; display:flex; flex-direction:column">

<div class="mtop" style="display:none; position:sticky; top:0; z-index:25; align-items:center; gap:12px; padding:10px 16px; background:#0f1b2d; color:#ffffff">
<button onClick="{{ mob.toggle }}" aria-label="Open menu" style="width:44px; height:44px; border:0; border-radius:12px; background:rgba(255,255,255,0.08); color:#ffffff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.menu }}"></path></svg></button>
<span style="width:32px; height:32px; border-radius:9px; background:#2f6bef; display:inline-flex; align-items:center; justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="{{ ic.sparkle }}" style="fill:#ffffff"></path></svg></span>
<span style="font-size:20px; font-weight:700">Verdict</span>
</div>

<sc-if value="{{ top.anyPop }}" hint-placeholder-val="{{ false }}">
<button aria-label="Close menu" tabindex="-1" onClick="{{ top.closeAll }}" style="position:fixed; inset:0; z-index:15; border:0; background:transparent; cursor:default"></button>
</sc-if>

<header class="pad" style="position:relative; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:14px; padding:22px 32px 0">
<div class="srch" style="position:relative; flex:1; max-width:560px; min-width:0">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute; left:16px; top:16px; color:#64748b; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; pointer-events:none"><path d="{{ ic.search }}"></path></svg>
<input type="search" aria-label="Search projects, departments and owners" placeholder="Search projects, departments, owners…" value="{{ top.q }}" onChange="{{ top.onQ }}" onFocus="{{ top.onFocus }}" onKeyDown="{{ top.onKey }}" style="width:100%; height:52px; padding:0 16px 0 46px; border:1px solid #e1e6ed; border-radius:14px; background:#ffffff; font-size:16px; color:#0f172a; box-shadow:0 1px 2px rgba(15,23,42,0.04)">
<sc-if value="{{ top.search.show }}" hint-placeholder-val="{{ false }}">
<div class="pop" role="listbox" aria-label="Search results" style="position:absolute; top:60px; left:0; right:0; z-index:40; max-height:440px; overflow-y:auto; padding:8px; background:#ffffff; border:1px solid #e1e6ed; border-radius:16px; box-shadow:0 20px 44px rgba(15,23,42,0.14)">
<sc-if value="{{ top.search.none }}" hint-placeholder-val="{{ false }}"><div style="padding:14px 12px; font-size:15px; color:#64748b">No tools, departments or owners match “{{ top.q }}”.</div></sc-if>
<sc-if value="{{ top.search.hasTools }}" hint-placeholder-val="{{ false }}">
<div style="padding:8px 12px 4px; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#64748b">Tools</div>
<sc-for list="{{ top.search.tools }}" as="r" hint-placeholder-count="3">
<button class="hov" role="option" onClick="{{ r.open }}" style="display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:6px 10px; border:0; border-radius:10px; background:#ffffff; font:inherit; color:#0f172a; text-align:left; cursor:pointer">
<span style="width:34px; height:34px; border-radius:9px; background:{{ r.color }}; color:#ffffff; display:inline-flex; align-items:center; justify-content:center; flex:none"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="{{ r.icon }}"></path></svg></span>
<span style="display:flex; flex-direction:column"><span style="font-size:15px; font-weight:700">{{ r.name }}</span><span style="font-size:13px; color:#64748b">{{ r.sub }}</span></span>
</button>
</sc-for>
</sc-if>
<sc-if value="{{ top.search.hasDepts }}" hint-placeholder-val="{{ false }}">
<div style="padding:8px 12px 4px; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#64748b">Departments</div>
<sc-for list="{{ top.search.depts }}" as="r" hint-placeholder-count="1">
<button class="hov" role="option" onClick="{{ r.open }}" style="display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:6px 10px; border:0; border-radius:10px; background:#ffffff; font:inherit; color:#0f172a; text-align:left; cursor:pointer">
<span style="width:34px; height:34px; border-radius:9px; background:{{ r.tint }}; color:{{ r.color }}; display:inline-flex; align-items:center; justify-content:center; flex:none"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="{{ r.icon }}"></path></svg></span>
<span style="display:flex; flex-direction:column"><span style="font-size:15px; font-weight:700">{{ r.name }}</span><span style="font-size:13px; color:#64748b">{{ r.sub }}</span></span>
</button>
</sc-for>
</sc-if>
<sc-if value="{{ top.search.hasOwners }}" hint-placeholder-val="{{ false }}">
<div style="padding:8px 12px 4px; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#64748b">Owners</div>
<sc-for list="{{ top.search.owners }}" as="r" hint-placeholder-count="1">
<button class="hov" role="option" onClick="{{ r.open }}" style="display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:6px 10px; border:0; border-radius:10px; background:#ffffff; font:inherit; color:#0f172a; text-align:left; cursor:pointer">
<span style="width:34px; height:34px; border-radius:50%; background:#eef1f5; color:#475569; font-size:13px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:none">{{ r.ini }}</span>
<span style="display:flex; flex-direction:column"><span style="font-size:15px; font-weight:700">{{ r.name }}</span><span style="font-size:13px; color:#64748b">{{ r.sub }}</span></span>
</button>
</sc-for>
</sc-if>
</div>
</sc-if>
</div>
<span style="flex:1"></span>
<div style="position:relative">
<button class="btn-s" onClick="{{ top.toggleNotif }}" aria-label="Notifications" aria-expanded="{{ top.notifOpen }}" style="position:relative; width:52px; height:52px; border:1px solid #e1e6ed; border-radius:14px; background:#ffffff; color:#334155; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 1px 2px rgba(15,23,42,0.04)">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.bell }}"></path></svg>
<sc-if value="{{ top.hasUnread }}" hint-placeholder-val="{{ true }}"><span style="position:absolute; top:11px; right:12px; width:10px; height:10px; border-radius:50%; background:#e5484d; border:2px solid #ffffff"></span></sc-if>
</button>
<sc-if value="{{ top.notifOpen }}" hint-placeholder-val="{{ false }}">
<div class="pop" role="dialog" aria-label="Notifications" style="position:absolute; right:0; top:62px; z-index:40; width:390px; max-width:calc(100vw - 32px); background:#ffffff; border:1px solid #e1e6ed; border-radius:18px; box-shadow:0 20px 44px rgba(15,23,42,0.14); overflow:hidden">
<div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px"><span style="font-size:17px; font-weight:700">Notifications</span><button class="lnk" onClick="{{ top.markRead }}" style="border:0; background:none; padding:6px; font:inherit; font-size:14px; color:#1d4ed8; cursor:pointer">Mark all as read</button></div>
<sc-for list="{{ top.notifs }}" as="nt" hint-placeholder-count="4">
<button class="hov" onClick="{{ nt.open }}" style="display:flex; gap:12px; align-items:flex-start; width:100%; padding:14px 18px; border:0; border-top:1px solid #edf0f4; background:{{ nt.bg }}; font:inherit; color:#0f172a; text-align:left; cursor:pointer">
<span style="width:9px; height:9px; margin-top:7px; border-radius:50%; background:{{ nt.dot }}; flex:none"></span>
<span style="flex:1; display:flex; flex-direction:column; gap:2px"><span style="font-size:15px; font-weight:700">{{ nt.title }}</span><span style="font-size:14px; color:#475569">{{ nt.body }}</span><span style="font-size:13px; color:#64748b">{{ nt.when }}</span></span>
</button>
</sc-for>
</div>
</sc-if>
</div>
<div style="position:relative">
<button onClick="{{ top.toggleProfile }}" aria-label="Account menu" aria-expanded="{{ top.profileOpen }}" style="display:flex; align-items:center; gap:12px; padding:4px; border:0; border-radius:14px; background:none; font:inherit; color:#0f172a; cursor:pointer; text-align:left">
<span style="width:52px; height:52px; border-radius:50%; background:#0f1b2d; color:#ffffff; font-size:17px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:none">{{ user.ini }}</span>
<span class="hide-sm" style="display:flex; flex-direction:column"><span style="font-size:17px">{{ user.name }}</span><span style="font-size:14px; color:#64748b">{{ user.role }}</span></span>
<svg class="hide-sm" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color:#64748b; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.chevDown }}"></path></svg>
</button>
<sc-if value="{{ top.profileOpen }}" hint-placeholder-val="{{ false }}">
<div class="pop" role="menu" aria-label="Account" style="position:absolute; right:0; top:66px; z-index:40; width:300px; padding:16px; background:#ffffff; border:1px solid #e1e6ed; border-radius:18px; box-shadow:0 20px 44px rgba(15,23,42,0.14); display:flex; flex-direction:column; gap:12px">
<div style="font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#64748b">View as</div>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px; border:1px solid #e1e6ed; border-radius:12px">
<button onClick="{{ top.viewExec }}" aria-pressed="{{ top.execPressed }}" style="min-height:40px; border:0; border-radius:9px; background:{{ top.execBg }}; color:{{ top.execFg }}; font:inherit; font-size:14px; font-weight:700; cursor:pointer">Executive</button>
<button onClick="{{ top.viewAnalyst }}" aria-pressed="{{ top.anaPressed }}" style="min-height:40px; border:0; border-radius:9px; background:{{ top.anaBg }}; color:{{ top.anaFg }}; font:inherit; font-size:14px; font-weight:700; cursor:pointer">Analyst</button>
</div>
<div style="font-size:13px; line-height:1.5; color:#64748b">Analyst view opens every project with the full operational breakdown.</div>
<div style="height:1px; background:#edf0f4"></div>
<button class="hov" onClick="{{ top.settings }}" role="menuitem" style="display:flex; align-items:center; gap:10px; min-height:44px; padding:0 10px; border:0; border-radius:10px; background:#ffffff; font:inherit; font-size:15px; color:#0f172a; cursor:pointer; text-align:left"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.settings }}"></path></svg>Settings</button>
<button class="hov" onClick="{{ top.reset }}" role="menuitem" style="display:flex; align-items:center; gap:10px; min-height:44px; padding:0 10px; border:0; border-radius:10px; background:#ffffff; font:inherit; font-size:15px; color:#0f172a; cursor:pointer; text-align:left"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.refresh }}"></path></svg>Reset prototype data</button>
</div>
</sc-if>
</div>
</header>

<main class="pad" style="flex:1; width:100%; max-width:1480px; padding:28px 32px 120px">
<sc-if value="{{ sc.home }}" hint-placeholder-val="{{ true }}">
<div class="fade" style="display:flex; flex-direction:column; gap:28px">
<section aria-labelledby="h-home" style="display:flex; flex-direction:column; gap:12px">
<div style="font-size:16px; color:#475569">{{ home.greet }}, Alex 👋 <span style="color:#64748b">· Monday, 14 Sep · your weekly read</span></div>
<h1 id="h-home" class="h1" style="margin:0; max-width:760px; font-size:36px; line-height:1.22; font-weight:700; letter-spacing:-0.015em; color:#0f172a; white-space:pre-line">{{ home.headline }}</h1>
<p style="margin:0; max-width:820px; font-size:18px; line-height:1.65; color:#475569">{{ home.sub1 }}<strong style="color:#1e293b">{{ home.subStrong }}</strong>{{ home.sub2 }}</p>
</section>

<div style="display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:14px 18px; background:#ffffff; border:1px solid #e5e9f0; border-radius:18px">
<span style="padding:0 8px 0 4px; font-size:15px; color:#64748b">Since you last checked · Fri 4:00 PM</span>
<button class="hov" onClick="{{ go.invoicebot }}" style="display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border:1px solid #e5e9f0; border-radius:12px; background:#f8fafc; font:inherit; font-size:16px; color:#0f172a; cursor:pointer">
<span style="width:8px; height:8px; border-radius:50%; background:#16a34a; flex:none"></span>
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color:#d97706; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round"><path d="{{ ic.party }}"></path></svg>
<span style="text-align:left"><strong>InvoiceBot broke even</strong> <span style="color:#475569">— now net positive</span></span>
</button>
<button class="hov" onClick="{{ go.ledgerly }}" style="display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border:1px solid #e5e9f0; border-radius:12px; background:#f8fafc; font:inherit; font-size:16px; color:#0f172a; cursor:pointer">
<span style="width:8px; height:8px; border-radius:50%; background:#dc2626"></span><strong>Ledgerly</strong><span style="color:#475569">slipped to Concern</span>
</button>
<button class="hov" onClick="{{ go.approvals }}" style="display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; border:1px solid #e5e9f0; border-radius:12px; background:#f8fafc; font:inherit; font-size:16px; color:#0f172a; cursor:pointer">
<span style="width:8px; height:8px; border-radius:50%; background:#2563eb"></span><span style="color:#475569">You cleared</span><strong>{{ home.clearedTxt }}</strong>
</button>
</div>

<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:20px">
<button class="lift" onClick="{{ go.departments }}" style="display:flex; flex-direction:column; gap:16px; min-height:186px; padding:24px; border:1px solid #c6e6d2; border-radius:20px; background:#eef8f2; font:inherit; color:inherit; text-align:left; cursor:pointer">

  constructor(props) { this.props = props || {}; }
  setState(patch) {
    const p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, p);
    requestRender();
  }
  forceUpdate() { requestRender(); }
}

const money = (v) => {
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  if (a === 0) return '£0';
  if (a >= 1000) return sg + '£' + (a / 1000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (a >= 9.95) return sg + '£' + Math.round(a) + 'k';
  return sg + '£' + a.toFixed(1) + 'k';
};

// ---------- derived numbers (pure) ----------
function calcSeries(t) {
  const empty = { n: 0, v: [], c: [], CV: [], CC: [], be: -1, paidBack: false, paidBackLast: false, valueToDate: 0, totalCost: t.build || 0, running: 0, start: null };
  if (!t.launched) return empty;
  const start = ix(t.launched), n = NOW_IDX - start + 1;
  if (n <= 0) return empty;
  const ramp = t.ramp || 6, v = [], c = [];
  for (let i = 0; i < n; i++) {
    v.push(t.value * Math.min(1, 0.06 + (0.94 * i) / ramp));
    c.push(t.run * (0.7 + 0.3 * Math.min(1, i / 6)));
  }
  if (n >= 2) { v[n - 2] = t.value / (1 + t.vt / 100); c[n - 2] = t.run / (1 + t.ct / 100); }
  if (t.vhist) t.vhist.forEach((x, j) => { const k = n - t.vhist.length + j; if (k >= 0) v[k] = x; });
  v[n - 1] = t.value; c[n - 1] = t.run;
  const CV = [], CC = []; let cv = 0, cc = t.build, be = -1;
  for (let i = 0; i < n; i++) { cv += v[i]; cc += c[i]; CV.push(cv); CC.push(cc); if (be < 0 && cv >= cc) be = i; }
  const running = CC[n - 1] - t.build;
  return { n, v, c, CV, CC, be, start, running, valueToDate: CV[n - 1], totalCost: CC[n - 1],
    paidBack: CV[n - 1] >= CC[n - 1], paidBackLast: n >= 2 && CV[n - 2] >= CC[n - 2] };
}

function niceMax(m) {
  const steps = [3, 4.5, 6, 9, 12, 15, 18, 24, 30, 45, 60, 90, 120, 150, 180, 240, 300, 450, 600, 900, 1200, 1500, 1800, 2400, 3000, 4500, 6000, 9000, 12000, 15000, 18000, 24000, 30000, 45000];
  for (const s of steps) if (s >= m * 1.04) return s;
  return m * 1.2;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.freshState(props && props.start);
    this._calc = {};
    this._tok = 0;
  }

  freshState(start) {
    const screen = SCREENS.indexOf(start) >= 0 ? start : 'home';
    return {
      screen, toolId: 'invoicebot', analyst: false, back: 'projects',
      f: { dept: screen === 'projects' ? 'fin' : '', status: '', owner: '', stage: '' },
      sortKey: 'status', sortDir: 1,
      q: '', searchOpen: false, notifOpen: false, notifRead: false, profileOpen: false, navOpen: false,
      pending: APPROVALS.map((a) => a.id), decisions: {}, clearedSession: 0,
      atTab: 'all', atQuick: 'all', atSort: 'priority',
      modal: null, note: '', cmpId: 'tax-optimiser',
      form: { name: '', dept: 'fin', owner: '', stage: 'Planned', value: '', run: '', build: '', desc: '', error: '' },
      team: TEAM.map((t) => Object.assign({}, t)), invite: '',
      panelOpen: false, panelMsgs: [], panelDraft: '', panelTyping: false,
      chats: SEED_CHATS.map((c) => Object.assign({}, c, { msgs: null })), activeChat: null, draft: '', typing: false,
      toast: null, period: '30', hidden: { rd: true, legal: true, other: true },
      prefs: { weekly: true, slack: false, slip: true, waiting: true, payback: true, depth: 'exec' },
      added: [],
    };
  }

  st() { if (!this.state) this.state = this.freshState(this.props && this.props.start); return this.state; }

  componentDidUpdate() {
    const s = this.st();
    const chat = s.chats.find((c) => c.id === s.activeChat);
    const pageMsgs = chat ? this.seedMsgs(chat) : [];
    const sig = (msgs, typing) => `${msgs.length}:${typing ? 1 : 0}`;
    const jobs = [['panel', s.panelMsgs, s.panelTyping, '_seenPanel'], ['page', pageMsgs, s.typing, '_seenPage']];
    jobs.forEach(([where, msgs, typing, key]) => {
      const now = sig(msgs, typing) + (where === 'page' ? ':' + s.activeChat : '');
      if (this[key] === now) return;
      this[key] = now;
      try {
        const box = document.getElementById(`vd-${where}-scroll`);
        if (!box) return;
        let last = -1;
        msgs.forEach((m, i) => { if (m.role === 'user') last = i; });
        const el = last >= 0 ? document.getElementById(`vd-${where}-m${last}`) : null;
        box.scrollTop = el ? Math.max(0, el.offsetTop - 12) : box.scrollHeight;
      } catch (e) { /* scrolling is a nicety */ }
    });
  }

  // ---------------- model ----------------
  calc(t) {
    if (!this._calc) this._calc = {};
    const key = t.id + ':' + (t.launched || '-');
    if (!this._calc[key]) this._calc[key] = calcSeries(t);
    return this._calc[key];
  }

  derive(t) {
    const d = DEPTS.find((x) => x.id === t.dept) || DEPTS[DEPTS.length - 1];
    const c = this.calc(t);
    const live = !!t.launched;
    return Object.assign({}, t, {
      deptName: d.name, deptObj: d, c, live,
      valuePrev: t.value / (1 + (t.vt || 0) / 100), runPrev: t.run / (1 + (t.ct || 0) / 100), usersPrev: t.users / (1 + (t.ut || 0) / 100),
      slipping: !!t.issue, watched: !t.issue && (t.status === 'Watch' || t.status === 'Under investigation'),
      roi: t.run ? t.value / t.run : 0, st: STATUS[t.status] || STATUS.Live, teamName: PEOPLE[t.owner] || 'Product',
    });
  }

  agg(ts) {
    const sum = (f) => ts.reduce((a, t) => a + f(t), 0);
    const value = sum((t) => t.value), valuePrev = sum((t) => t.valuePrev);
    const run = sum((t) => t.run), runPrev = sum((t) => t.runPrev);
    const users = sum((t) => t.users), usersPrev = sum((t) => t.usersPrev);
    const invested = sum((t) => (t.live ? t.c.totalCost : 0));
    return { value, valuePrev, run, runPrev, users, usersPrev, invested, n: ts.length,
      vg: valuePrev ? (value / valuePrev - 1) * 100 : 0, rg: runPrev ? (run / runPrev - 1) * 100 : 0, ug: usersPrev ? (users / usersPrev - 1) * 100 : 0 };
  }

  model() {
    const s = this.st();
    const tools = TOOLS.concat(s.added).map((t) => this.derive(t));
    const byId = {};
    tools.forEach((t) => { byId[t.id] = t; });
    const live = tools.filter((t) => t.live);
    const depts = DEPTS.map((d) => {
      const ts = tools.filter((t) => t.dept === d.id);
      return Object.assign({}, d, this.agg(ts), { tools: ts, slipping: ts.filter((t) => t.slipping) });
    });
    const pending = s.pending.map((id) => APPROVALS.find((a) => a.id === id)).filter(Boolean);
    return {
      tools, byId, live, depts, total: this.agg(tools), pending,
      slipping: tools.filter((t) => t.slipping), idle: tools.filter((t) => t.status === 'Idle'), watched: tools.filter((t) => t.watched),
      running: live.length, paid: live.filter((t) => t.c.paidBack).length, paidLast: live.filter((t) => t.c.paidBackLast).length,
      crossedNow: live.filter((t) => t.c.paidBack && !t.c.paidBackLast),
    };
  }

  payback(t) {
    const c = t.c, n = c.n;
    if (!t.live) {
      const net = (t.estValue || 0) - (t.estRun || 0);
      return { status: 'planned', months: net > 0 && t.build ? Math.ceil(t.build / net) : null, net };
    }
    const net = t.value - t.run;
    if (c.paidBack) return { status: c.paidBackLast ? 'paid' : 'crossed', beIdx: c.start + c.be, monthsToBe: c.be + 1, ahead: c.valueToDate - c.totalCost, net };
    const deficit = c.totalCost - c.valueToDate;
    return { status: 'not', deficit, net, months: net > 0 ? Math.ceil(deficit / net) : null };
  }

  // ---------------- actions ----------------
  nav(screen, extra) {
    this.setState(Object.assign({ screen, searchOpen: false, notifOpen: false, profileOpen: false, navOpen: false, q: '' }, extra || {}));
    try { window.scrollTo(0, 0); } catch (e) { /* noop */ }
  }
  openTool(id) { const s = this.st(); this.nav('project', { toolId: id, back: s.screen === 'project' ? s.back : s.screen, analyst: s.prefs.depth === 'analyst' }); }
  openDept(id) { this.nav('projects', { f: { dept: id, status: '', owner: '', stage: '' } }); }
  setFilter(key, val) { const f = Object.assign({}, this.st().f); f[key] = val; this.setState({ f }); }
  clearFilters() { this.setState({ f: { dept: '', status: '', owner: '', stage: '' } }); }
  sortBy(key) {
    const s = this.st();
    if (s.sortKey === key) this.setState({ sortDir: -s.sortDir });
    else this.setState({ sortKey: key, sortDir: 1 });
  }

  showToast(text, action, label) {
    this._tok = (this._tok || 0) + 1;
    const token = this._tok;
    this.setState({ toast: { text, undo: action || null, label: label || 'Undo', token } });
    setTimeout(() => { const t = this.st().toast; if (t && t.token === token) this.setState({ toast: null }); }, 5200);
  }

  openReview(id) {
    if (this.st().pending.indexOf(id) < 0) { this.showToast('Already cleared — nothing left to review.'); return; }
    this.setState({ modal: { type: 'review', id }, note: '', notifOpen: false, searchOpen: false, profileOpen: false });
  }

  decide(id, kind) {
    const s = this.st();
    if (s.pending.indexOf(id) < 0) return;
    const ap = APPROVALS.find((a) => a.id === id);
    const tool = TOOLS.find((t) => t.id === ap.tool);
    const before = s.pending.slice();
    const decisions = Object.assign({}, s.decisions);
    decisions[id] = kind;
    this.setState({ pending: s.pending.filter((x) => x !== id), decisions, clearedSession: s.clearedSession + 1, modal: null, note: '' });
    const verb = kind === 'approved' ? 'Approved' : kind === 'declined' ? 'Declined' : 'Sent back with a note';
    this.showToast(`${verb}: ${tool.name} — ${lcFirst(ap.title)}`, () => {
      const cur = this.st();
      const d2 = Object.assign({}, cur.decisions);
      delete d2[id];
      this.setState({ pending: before.filter((x) => x === id || cur.pending.indexOf(x) >= 0), decisions: d2, clearedSession: Math.max(0, cur.clearedSession - 1), toast: null });
    });
  }

  openPanel(q) {
    this.setState({ panelOpen: true, notifOpen: false, searchOpen: false, profileOpen: false });
    if (q) this.send('panel', q);
  }

  ctx() { const s = this.st(); return { screen: s.screen, toolId: s.screen === 'project' ? s.toolId : null, dept: s.screen === 'projects' ? s.f.dept : '' }; }

  send(where, text) {
    const q = String(text || '').trim();
    if (!q) return;
    const ctx = this.ctx();
    if (where === 'panel') {
      const s = this.st();
      this.setState({ panelMsgs: s.panelMsgs.concat([{ role: 'user', text: q }]), panelDraft: '', panelTyping: true, panelOpen: true });
      setTimeout(() => { this.setState({ panelMsgs: this.st().panelMsgs.concat([{ role: 'ai', q, ctx }]), panelTyping: false }); }, 650);
      return;
    }
    const s = this.st();
    let chats = s.chats.slice(), id = s.activeChat;
    let chat = chats.find((c) => c.id === id);
    if (!chat) {
      id = 'n' + Date.now();
      chat = { id, group: 'Today', title: q.length > 42 ? q.slice(0, 40) + '…' : q, q, msgs: [] };
      chats = [chat].concat(chats);
    }
    const msgs = (chat.msgs || this.seedMsgs(chat)).concat([{ role: 'user', text: q }]);
    chats = chats.map((c) => (c.id === id ? Object.assign({}, c, { msgs }) : c));
    this.setState({ chats, activeChat: id, draft: '', typing: true });
    setTimeout(() => {
      const cur = this.st();
      this.setState({ typing: false, chats: cur.chats.map((c) => (c.id === id ? Object.assign({}, c, { msgs: (c.msgs || []).concat([{ role: 'ai', q, ctx }]) }) : c)) });
    }, 700);
  }

  seedMsgs(chat) { return chat.q && chat.msgs === null ? [{ role: 'user', text: chat.q }, { role: 'ai', q: chat.q, ctx: {} }] : (chat.msgs || []); }

  openChat(id) {
    const s = this.st();
    this.setState({ chats: s.chats.map((c) => (c.id === id && c.msgs === null ? Object.assign({}, c, { msgs: this.seedMsgs(c) }) : c)), activeChat: id });
  }

  expandPanel() {
    const s = this.st();
    if (!s.panelMsgs.length) { this.setState({ panelOpen: false }); this.nav('ask', { activeChat: null }); return; }
    const first = s.panelMsgs.find((m) => m.role === 'user');
    const id = 'p' + Date.now();
    const title = first ? (first.text.length > 42 ? first.text.slice(0, 40) + '…' : first.text) : 'Quick question';
    this.setState({ chats: [{ id, group: 'Today', title, q: null, msgs: s.panelMsgs.slice() }].concat(s.chats), panelOpen: false, panelMsgs: [] });
    this.nav('ask', { activeChat: id });
  }

  addProject(e) {
    if (e && e.preventDefault) e.preventDefault();
    const s = this.st(), f = s.form;
    const name = f.name.trim();
    if (!name) { this.setState({ form: Object.assign({}, f, { error: 'Give the project a name.' }) }); return; }
    if (TOOLS.concat(s.added).some((t) => t.name.toLowerCase() === name.toLowerCase())) { this.setState({ form: Object.assign({}, f, { error: 'A project with that name already exists.' }) }); return; }
    const num = (v) => { const x = parseFloat(v); return isFinite(x) && x > 0 ? x : 0; };
    const id = 'new-' + Date.now();
    const tool = { id, name, dept: f.dept, owner: f.owner.trim() || 'Alex Riviera', status: 'Planned', stage: f.stage, icon: 'sparkles', color: '#64748b',
      desc: f.desc.trim() || 'New project — details to follow.', users: 0, ut: 0, run: 0, ct: 0, value: 0, vt: 0, launched: null,
      build: num(f.build), estValue: num(f.value), estRun: num(f.run), eligible: 0, version: '—', runsOn: '—', crew: 1, updated: '14 Sep', schedule: 'Not started', risk: null };
    this.setState({ added: s.added.concat([tool]), modal: null, form: { name: '', dept: 'fin', owner: '', stage: 'Planned', value: '', run: '', build: '', desc: '', error: '' } });
    this.showToast(`Added ${name} to ${(DEPTS.find((d) => d.id === f.dept) || {}).name}`, () => { this.setState({ toast: null }); this.openTool(id); }, 'View');
  }

  exportCsv() {
    const M = this.model();
    const rows = this.filteredTools(M);
    const lines = [['Tool', 'Department', 'Status', 'Owner', 'Users', 'Run cost £k/mo', 'Value £k/mo'].join(',')]
      .concat(rows.map((t) => [t.name, t.deptName, t.status, t.owner, t.users, t.run, t.value].map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')));
    let ok = false;
    try {
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'verdict-projects.csv';
      a.click();
      ok = true;
    } catch (e) { ok = false; }
    this.showToast(ok ? `Exported ${rows.length} project${rows.length === 1 ? '' : 's'} to CSV` : `Export prepared for ${rows.length} projects`);
  }

  reset() {
    const s = this.st();
    this._calc = {};
    this.setState(Object.assign(this.freshState('home'), { screen: s.screen === 'project' ? 'home' : s.screen }));
    this.showToast('Prototype reset to the 14 Sep snapshot');
  }

  linkHandler(target) {
    const parts = String(target).split(':');
    const kind = parts[0], id = parts[1];
    return (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (kind === 'tool') this.openTool(id);
      else if (kind === 'dept') this.openDept(id);
      else if (kind === 'go') this.nav(id);
      else if (kind === 'review') this.openReview(id);
    };
  }

  segs(str) {
    const out = [];
    const re = /\*\*(.+?)\*\*|\[\[([^|\]]+)\|([^\]]+)\]\]/g;
    const noop = () => {};
    let last = 0, m;
    while ((m = re.exec(str))) {
      if (m.index > last) out.push({ s: str.slice(last, m.index), plain: true, bold: false, link: false, go: noop });
      if (m[1] != null) out.push({ s: m[1], plain: false, bold: true, link: false, go: noop });
      else out.push({ s: m[3], plain: false, bold: false, link: true, go: this.linkHandler(m[2]) });
      last = re.lastIndex;
    }
    if (last < str.length) out.push({ s: str.slice(last), plain: true, bold: false, link: false, go: noop });
    return out;
  }

  blocksVM(blocks, where) {
    return blocks.map((b) => ({
      isP: !!b.p, isUl: !!b.ul, isTable: !!b.table, isAsk: !!b.ask,
      segs: b.p ? this.segs(b.p) : [],
      items: b.ul ? b.ul.map((x) => ({ segs: this.segs(x) })) : [],
      head: b.table ? b.table.head.map((h) => ({ txt: h })) : [],
      rows: b.table ? b.table.rows.map((r) => ({ cells: r.map((c) => ({ segs: this.segs(String(c)) })) })) : [],
      cols: b.table ? `minmax(110px, 1.5fr) repeat(${b.table.head.length - 1}, minmax(0, 1fr))` : 'none',
      asks: b.ask ? b.ask.map((q) => ({ q, click: () => this.send(where, q) })) : [],
    }));
  }

  msgsVM(msgs, where, M) {
    return msgs.map((m, i) => ({
      key: i, anchor: `vd-${where}-m${i}`, isUser: m.role === 'user', isAi: m.role === 'ai', text: m.text || '', justify: m.role === 'user' ? 'flex-end' : 'flex-start',
      blocks: m.role === 'ai' ? this.blocksVM(this.answer(m.q, m.ctx || {}, M), where) : [],
    }));
  }

  // ---------------- answer engine ----------------
  findTools(q, M) {
    const s = q.toLowerCase();
    const hits = [];
    M.tools.forEach((t) => {
      const names = [t.name.toLowerCase()].concat(t.alias || []);
      const pos = names.map((n) => s.indexOf(n)).filter((p) => p >= 0);
      if (pos.length) hits.push({ t, p: Math.min.apply(null, pos) });
    });
    return hits.sort((a, b) => a.p - b.p).map((h) => h.t);
  }

  findDepts(q) {
    const s = ' ' + q.toLowerCase().replace(/[^a-z0-9& ]/g, ' ').replace(/\s+/g, ' ') + ' ';
    const hits = [];
    DEPTS.forEach((d) => {
      let p = -1;
      if (d.id === 'it') { const m = /\bIT\b/.exec(q); if (m) p = m.index; }
      if (d.id === 'hr') { const m = /\bHR\b(?!\s*Assistant)/i.exec(q); if (m) p = m.index; }
      const names = (d.id === 'other' || d.id === 'it' || d.id === 'hr' ? [] : [d.name.toLowerCase()]).concat(d.alias);
      names.forEach((n) => { const i = s.indexOf(n); if (i >= 0 && (p < 0 || i < p)) p = i; });
      if (p >= 0) hits.push({ d, p });
    });
    return hits.sort((a, b) => a.p - b.p).map((h) => h.d);
  }

  answer(q, ctx, M) {
    const s = String(q || '').toLowerCase();
    let tools = this.findTools(q, M);
    if (!tools.length && ctx && ctx.toolId && M.byId[ctx.toolId] && /\b(it|its|this tool|this one)\b/.test(s)) tools = [M.byId[ctx.toolId]];
    const depts = this.findDepts(q);
    if (/first|priorit|start with|most urgent|tackle/.test(s)) return this.aPriorities(M);
    if (/board|summar|recap|overview|brief/.test(s) && !tools.length && !depts.length) return this.aBoard(M);
    if (tools.length >= 2 && /compar|\bvs\b|versus|against/.test(s)) return this.aCompareTools(tools[0], tools[1]);
    if (tools.length) return this.aTool(tools[0], s, M);
    if (/approv|waiting|sign.?off|pending|queue|decision/.test(s)) return this.aApprovals(M);
    if (/cut|kill|retire|barely|idle|unused|shelf|sunset|switch off|turn off|least used|low.?value/.test(s)) return this.aCuts(M);
    if (/slip|declin|losing|at risk|risk|problem|issue|struggl|falling/.test(s)) return this.aSlipping(M, depts[0]);
    if (depts.length >= 2) return this.aCompareDepts(depts[0], depts[1], M);
    if (/per pound|roi|return on|most efficient|best return|returns the most/.test(s)) return this.aRoi(M);
    if (/top|best|perform|winner|most valuable|star/.test(s)) return this.aTop(M, depts[0]);
    if (depts.length) return this.aDept(depts[0], M);
    if (/cost|spend|expensive|budget|bill/.test(s)) return this.aCost(M);
    if (/saving|value|return|worth/.test(s)) return this.aValue(M);
    if (/user|adoption|usage|people/.test(s)) return this.aAdoption(M);
    return this.aFallback(M);
  }

  tl(t) { return `[[tool:${t.id}|${t.name}]]`; }

  aBoard(M) {
    const T = M.total, sl = M.slipping;
    const risk = sl.reduce((a, t) => a + t.value * 3, 0);
    const growing = M.depts.filter((d) => d.ug > 0).length;
    const dues = sl.map((t) => (t.risk ? parseInt(t.risk.due, 10) : 0));
    const latest = sl.length ? sl[dues.indexOf(Math.max.apply(null, dues))].risk.due : '';
    const crossed = M.crossedNow.map((t) => this.tl(t));
    const oldest = M.pending.slice().sort((a, b) => b.age - a.age)[0];
    return [
      { p: "Here's a board-ready summary of September so far:" },
      { ul: [
        `**Value:** your ${M.running} tools returned **${money(T.value)}** this month, up ${pct(T.vg)} — about **${Math.round(T.value / T.run)}× what they cost to run** (${money(T.run)}).`,
        `**Adoption:** **${usersShort(T.users)}** people use them, up ${pct(T.ug)}; ${growing === M.depts.length ? 'every department grew' : `${growing} of ${M.depts.length} departments grew`}.`,
        `**Payback:** **${M.paid} of ${M.running}** have paid back their build, up from ${M.paidLast} last month${crossed.length ? ` — ${crossed.join(' and ')} crossed this month` : ''}.`,
        sl.length ? `**Risks:** ${sl.map((t) => `${this.tl(t)} (users ${trend(t.ut, true).arrow}${pct(t.ut)})`).join(' and ')} put **${money(risk)} a quarter** at risk; fixes are due by ${latest}.` : '**Risks:** nothing is slipping.',
        oldest ? `**Decisions:** ${word(M.pending.length)} approval${M.pending.length > 1 ? 's are' : ' is'} waiting on you — the oldest (${this.tl(M.byId[oldest.tool])}, ${lcFirst(oldest.title)}) for ${oldest.age} days.` : '**Decisions:** nothing is waiting on you.',
      ] },
      { ask: ['Why is Ledgerly declining?', "What's waiting on my approval?"] },
    ];
  }

  aApprovals(M) {
    const s = this.st();
    if (!M.pending.length) return [{ p: `Nothing is waiting on you. You've cleared ${2 + s.clearedSession} approvals since Friday, so every team is unblocked.` }];
    const list = M.pending.slice().sort((a, b) => b.age - a.age);
    return [
      { p: `**${cap(word(list.length))} approval${list.length > 1 ? 's are' : ' is'} waiting on you**, oldest first:` },
      { ul: list.map((a) => `${this.tl(M.byId[a.tool])} — ${lcFirst(a.title)}, waiting ${a.age} day${a.age > 1 ? 's' : ''}${a.blocking ? ' and delaying the launch' : ''}. ${a.take} [[review:${a.id}|Review]]`) },
    ];
  }

  aCuts(M) {
    const idle = M.idle;
    if (!idle.length) return [{ p: 'Nothing is idle right now — every live tool has steady use.' }];
    const save = idle.reduce((a, t) => a + t.run, 0), lose = idle.reduce((a, t) => a + t.value, 0);
    const pb = idle.map((t) => ({ t, p: this.payback(t) }));
    return [
      { p: `**${cap(word(idle.length))} tool${idle.length > 1 ? 's are' : ' is'} barely used:**` },
      { ul: pb.map(({ t, p }) => `${this.tl(t)} — ${commas(t.users)} users, ${money(t.run)}/mo to run, returns ${money(t.value)}/mo${p.status === 'not' ? `, still ${money(p.deficit)} short of paying back its ${money(t.build)} build` : ''}.`) },
      { p: `Retiring ${idle.length > 1 ? 'both' : 'it'} saves **${money(save)}/mo** but gives up ${money(lose)}/mo of value, so cutting isn't a clear win on cost alone. The real question is payback: at today's usage, ${pb.filter((x) => x.p.status === 'not').map((x, i) => `${x.t.name} needs ~${x.p.months}${i ? '' : ' more months to break even'}`).join(' and ')}.` },
      { p: 'A middle path: fold [[tool:campaign-insights|Campaign Insights]] into [[tool:lead-scorer|Lead Scorer]]\'s weekly digest, and pause [[tool:patch-planner|Patch Planner]] until the next patch cycle.' },
    ];
  }

  aSlipping(M, dept) {
    const list = M.slipping.filter((t) => !dept || t.dept === dept.id);
    const watched = M.watched.filter((t) => !dept || t.dept === dept.id);
    if (!list.length) return [{ p: `Nothing${dept ? ' in ' + dept.name : ''} is slipping right now.${watched.length ? ` Owners are keeping an eye on ${watched.map((t) => this.tl(t)).join(' and ')}, but neither needs you.` : ''}` }];
    const out = [
      { p: `${cap(word(list.length))} tool${list.length > 1 ? 's are' : ' is'} slipping${dept ? ' in ' + dept.name : ''}:` },
      { ul: list.map((t) => `${this.tl(t)} (${t.deptName}) — ${t.issue.home.replace(/\.$/, '')}. About **${money(t.value * 3)} a quarter** is at stake; ${t.risk.owner.split(' ')[0]}'s fix is due ${t.risk.due}.`) },
    ];
    if (watched.length) out.push({ p: `Owners are also watching ${watched.map((t) => `${this.tl(t)} (${t.status === 'Watch' ? 'run cost creeping up' : 'savings figures under review'})`).join(' and ')}, but neither needs you yet.` });
    out.push({ ask: list.map((t) => `Why is ${t.name} declining?`) });
    return out;
  }

  aCompareDepts(a, b, M) {
    const A = M.depts.find((d) => d.id === a.id), B = M.depts.find((d) => d.id === b.id);
    const ra = A.value / A.run, rb = B.value / B.run;
    const byVal = A.value >= B.value ? A : B, byRoi = ra >= rb ? A : B;
    const slip = (D) => (D.slipping.length ? D.slipping.map((t) => this.tl(t)).join(', ') : 'None');
    return [
      { p: `**${A.name} vs ${B.name}**, this month:` },
      { table: { head: ['', A.name, B.name], rows: [
        ['Value', money(A.value), money(B.value)],
        ['Run cost', money(A.run), money(B.run)],
        ['Return', `${ra.toFixed(1)}×`, `${rb.toFixed(1)}×`],
        ['Value growth', `${trend(A.vg, true).arrow} ${pct(A.vg)}`, `${trend(B.vg, true).arrow} ${pct(B.vg)}`],
        ['Users', usersShort(A.users), usersShort(B.users)],
        ['Tools', String(A.n), String(B.n)],
        ['Slipping', slip(A), slip(B)],
      ] } },
      { p: byVal === byRoi ? `**${byVal.name}** leads on both total value and return per pound.` : `**${byVal.name}** returns more in total (${money(byVal.value)}), while **${byRoi.name}** returns more per pound (${(byRoi.value / byRoi.run).toFixed(1)}× vs ${(byVal.value / byVal.run).toFixed(1)}×).` },
    ];
  }

  aRoi(M) {
    const ds = M.depts.filter((d) => d.run > 0).slice().sort((x, y) => y.value / y.run - x.value / x.run);
    const top = ds[0], bottom = ds[ds.length - 1];
    return [
      { p: `**${top.name}** returns the most per pound: ${(top.value / top.run).toFixed(1)}× its run cost. ${bottom.name} returns the least, at ${(bottom.value / bottom.run).toFixed(1)}×.` },
      { table: { head: ['Department', 'Return', 'Value / mo', 'Run / mo'], rows: ds.map((d) => [`[[dept:${d.id}|${d.name}]]`, `${(d.value / d.run).toFixed(1)}×`, money(d.value), money(d.run)]) } },
    ];
  }

  aTop(M, dept) {
    const list = M.live.filter((t) => !dept || t.dept === dept.id).sort((a, b) => b.value - a.value).slice(0, 5);
    const bestRoi = list.slice().sort((a, b) => b.roi - a.roi)[0];
    return [
      { p: `Top ${list.length} by value${dept ? ' in ' + dept.name : ''} this month:` },
      { table: { head: ['Tool', 'Value / mo', 'Return', 'Users'], rows: list.map((t) => [this.tl(t), money(t.value), `${t.roi.toFixed(1)}×`, usersShort(t.users)]) } },
      { p: `${this.tl(list[0])} leads on value${bestRoi !== list[0] ? `; for return per pound, ${this.tl(bestRoi)} is the standout at ${bestRoi.roi.toFixed(1)}×` : ', and on return per pound too'}.` },
    ];
  }

  aDept(d, M) {
    const D = M.depts.find((x) => x.id === d.id);
    const top = D.tools.filter((t) => t.live).sort((a, b) => b.value - a.value);
    const out = [
      { p: `**${D.name}** tools returned **${money(D.value)}** this month (${trend(D.vg, true).arrow} ${pct(D.vg)}) for ${money(D.run)} to run — about ${(D.value / D.run).toFixed(1)}× their cost, or roughly ${money(D.value * 12)} a year at this rate. ${usersShort(D.users)} people use them.` },
      { ul: top.map((t) => `${this.tl(t)} — ${money(t.value)}/mo · ${t.status}${t.slipping ? ' · slipping' : ''}`) },
    ];
    out.push({ p: D.slipping.length ? `Keep an eye on ${D.slipping.map((t) => this.tl(t)).join(' and ')}: ${money(D.slipping.reduce((a, t) => a + t.value * 3, 0))} a quarter rides on ${D.slipping.length > 1 ? 'them' : 'it'}.` : `Nothing in ${D.name} is slipping.` });
    return out;
  }

  aCost(M) {
    const T = M.total;
    const top = M.live.slice().sort((a, b) => b.run - a.run).slice(0, 5);
    const rising = M.live.filter((t) => t.ct >= 5).sort((a, b) => b.ct - a.ct).slice(0, 3);
    return [
      { p: `Your ${M.running} tools cost **${money(T.run)}/mo** to run (${trend(T.rg, false).arrow} ${pct(T.rg)} vs last month) — about a sixth of the ${money(T.value)} they return.` },
      { table: { head: ['Tool', 'Run / mo', 'Return'], rows: top.map((t) => [this.tl(t), money(t.run), `${t.roi.toFixed(1)}×`]) } },
      { p: `Fastest-rising run costs: ${rising.map((t) => `${this.tl(t)} (+${t.ct}%)`).join(', ')}.` },
    ];
  }

  aValue(M) {
    const T = M.total;
    const ds = M.depts.slice().sort((a, b) => b.value - a.value).slice(0, 3);
    return [
      { p: `Your tools returned **${money(T.value)}** this month (${trend(T.vg, true).arrow} ${pct(T.vg)}) — about ${money(T.value * 12)} a year at this rate, against ${money(T.run)}/mo to run.` },
      { ul: ds.map((d) => `[[dept:${d.id}|${d.name}]] — ${money(d.value)} (${trend(d.vg, true).arrow} ${pct(d.vg)})`) },
    ];
  }

  aAdoption(M) {
    const T = M.total;
    const growing = M.live.filter((t) => t.users >= 500).sort((a, b) => b.ut - a.ut).slice(0, 3);
    const falling = M.live.filter((t) => t.ut < 0 && t.status !== 'Idle');
    return [
      { p: `**${commas(T.users)}** people used your tools this month, up ${pct(T.ug)}.` },
      { ul: [`Fastest-growing: ${growing.map((t) => `${this.tl(t)} (+${t.ut}%)`).join(', ')}.`, falling.length ? `Falling: ${falling.map((t) => `${this.tl(t)} (${trend(t.ut, true).arrow}${pct(t.ut)})`).join(', ')}.` : 'Nothing is losing users.'] },
    ];
  }

  aPriorities(M) {
    const items = [];
    const blocking = M.pending.filter((a) => a.blocking);
    blocking.forEach((a) => items.push(`**${M.byId[a.tool].name}** — decide on the ${lcFirst(a.title)}. It has waited ${a.age} days and is holding up a launch; Verdict recommends approving. [[review:${a.id}|Review]]`));
    M.slipping.slice().sort((a, b) => b.value - a.value).forEach((t) => items.push(`**${t.name}** — ${money(t.value * 3)} a quarter depends on it. ${t.risk.owner.split(' ')[0]}'s fix (${t.risk.mitigation}) is due ${t.risk.due}. [[tool:${t.id}|Open]]`));
    const rest = M.pending.filter((a) => !a.blocking);
    if (rest.length) items.push(`${rest.map((a) => `**${M.byId[a.tool].name}**`).join(' and ')} — ${rest.length > 1 ? 'both low-risk approvals; a minute each' : 'a low-risk approval'}. [[go:attention|See all]]`);
    if (!items.length) return [{ p: "Nothing needs you right now. Everything slipping is fixed and every approval is cleared — enjoy the quiet." }];
    return [{ p: "Here's the order I'd take them in:" }, { ul: items }];
  }

  aCompareTools(a, b) {
    const pa = this.payback(a), pb = this.payback(b);
    const pbTxt = (p) => (p.status === 'not' ? `${money(p.deficit)} to go` : p.status === 'planned' ? 'Not live' : 'Paid back');
    return [
      { p: `**${a.name} vs ${b.name}:**` },
      { table: { head: ['', a.name, b.name], rows: [
        ['Status', a.status, b.status], ['Users', usersShort(a.users), usersShort(b.users)],
        ['Run / mo', money(a.run), money(b.run)], ['Value / mo', money(a.value), money(b.value)],
        ['Return', `${a.roi.toFixed(1)}×`, `${b.roi.toFixed(1)}×`], ['Payback', pbTxt(pa), pbTxt(pb)],
      ] } },
    ];
  }

  aTool(t, s, M) {
    if (!t.live) return [{ p: `**${t.name}** is planned for ${t.deptName}, so there's no usage or value data yet. Once it's live I'll track adoption, cost and payback here.` }];
    if (t.id === 'ledgerly' && /declin|why|fix|worth|sav|fall|drop|wrong|happen|keep/.test(s)) return this.aLedgerly(t);
    if (t.id === 'supplychain' && /v2\.3|release|why|declin|drop|fall|slow|happen|wrong|fix/.test(s)) return this.aSupply(t, M);
    const ap = M.pending.find((a) => a.tool === t.id);
    if (ap && /rollout|roll out|approv|worth|should|deploy|expand|access|v2\.1|sign/.test(s)) return this.aApprovalFor(ap, t);
    if (/paid|payback|pay back|break.?even|worth/.test(s)) return this.aPayback(t);
    if (/cost|cheaper|spend|expensive|bill|drive/.test(s)) return this.aToolCost(t);
    return this.aToolSummary(t);
  }

  aToolSummary(t) {
    const p = this.payback(t);
    const phrase = { Live: 'live and healthy', Watch: 'on watch', Concern: 'a concern', 'Under investigation': 'under investigation', Pilot: 'in pilot', Idle: 'barely used' }[t.status] || t.status.toLowerCase();
    const adopt = t.eligible ? Math.round((t.users / t.eligible) * 100) : 0;
    const pbLine = p.status === 'crossed' ? `broke even this month — ${money(t.c.valueToDate)} of value against ${money(t.c.totalCost)} of cost so far.`
      : p.status === 'paid' ? `paid back in ${mlab(p.beIdx, true)}, and is ${money(p.ahead)} ahead since launch.`
        : p.months ? `${money(p.deficit)} to go — about ${p.months} months at today's rate.` : `not on track to pay back at today's usage.`;
    return [
      { p: `**${t.name}** is ${phrase}. ${commas(t.users)} people used it this month (${trend(t.ut, true).arrow} ${pct(t.ut)} vs last month)${adopt ? ` — ${adopt}% of the ${commas(t.eligible)} who could` : ''}.` },
      { ul: [
        `**Value:** about ${money(t.value)}/mo, ${t.roi.toFixed(1)}× its ${money(t.run)}/mo running cost.`,
        `**Payback:** ${pbLine}`,
        `**Risk:** ${t.risk ? `${t.risk.level.toLowerCase()} — ${lcFirst(t.risk.text)}. Mitigation: ${t.risk.mitigation} (${t.risk.owner}, due ${t.risk.due}).` : 'nothing open.'}`,
      ] },
    ];
  }

  aPayback(t) {
    const p = this.payback(t), c = t.c;
    if (p.status === 'not') return [{ p: `Not yet. **${t.name}** has returned ${money(c.valueToDate)} against ${money(c.totalCost)} of build and running cost, so it's **${money(p.deficit)}** short. ${p.months ? `At today's net ${money(p.net)} a month it pays back around ${mlab(NOW_IDX + p.months, true)}.` : "At today's usage it won't pay back."}` }];
    return [{ p: `Yes. **${t.name}** ${p.status === 'crossed' ? 'crossed break-even this month' : `paid back in ${mlab(p.beIdx, true)}, ${p.monthsToBe} months after launch`}: ${money(c.valueToDate)} of value against ${money(c.totalCost)} of build (${money(t.build)}) and running cost since ${mlab(c.start, true)}. It now nets about **${money(p.net)} a month**.` }];
  }

  aToolCost(t) {
    const per = t.users ? (t.run * 1000) / t.users : 0;
    return [
      { p: `**${t.name}** costs ${money(t.run)}/mo to run (${trend(t.ct, false).arrow} ${pct(t.ct)} vs last month): about ${money(t.run * 0.62)} compute and ${money(t.run * 0.38)} storage and API calls — £${per.toFixed(2)} per active user.` },
      { p: `Since launch it has spent ${money(t.c.running)} on running costs on top of the ${money(t.build)} build. It returns ${t.roi.toFixed(1)}× what it costs to run, so cost isn't the issue unless that ratio starts to fall.` },
    ];
  }

  aApprovalFor(ap, t) {
    const p = this.payback(t);
    const after = (t.value + ap.valueDelta) - (t.run + ap.costDelta);
    const mAfter = p.status === 'not' && after > 0 ? Math.ceil(p.deficit / after) : null;
    return [
      { p: `**Likely yes.** ${ap.ask}` },
      { ul: ap.evidence.concat([`Adds ${ap.costDelta >= 0 ? '+' : '−'}${money(Math.abs(ap.costDelta))}/mo run cost for about +${money(ap.valueDelta)}/mo of value.`]) },
      { p: p.status === 'not' && p.months && mAfter ? `It hasn't paid back yet: about **${p.months} months** to go at pilot scale, or **~${mAfter}** if you approve. [[review:${ap.id}|Review the request]]` : `${ap.take} [[review:${ap.id}|Review the request]]` },
    ];
  }

  aLedgerly(t) {
    const h = t.uhist;
    return [
      { p: `Ledgerly has lost users three months running: **${commas(h[0])} → ${commas(h[1])} → ${commas(h[2])} → ${commas(h[3])}** since June. Three things line up:` },
      { ul: [
        'The slide started with **v3.0 in June**, which moved matching onto a new screen. Accounts Payable usage is down 34% since.',
        `Run cost is **up ${t.ct}%** because the new scanning vendor bills per page, so each remaining user costs more.`,
        'Month-end reconciliations are drifting back to spreadsheets — 3 of 5 AP leads say the new flow takes longer.',
      ] },
      { p: `**Is it fixable?** Probably. ${t.risk.owner}'s plan — ${t.risk.mitigation} — is due ${t.risk.due}. If adoption gets back to July's level, about **${money(t.value * 3)} a quarter** is protected, and it still returns ${t.roi.toFixed(1)}× its running cost today. Worth saving.` },
      { ask: ['What does Ledgerly cost to run?', 'Which tools are slipping?'] },
    ];
  }

  aSupply(t, M) {
    const ops = M.live.filter((x) => x.dept === 'ops').sort((a, b) => b.value - a.value);
    const rank = ops.indexOf(ops.find((x) => x.id === t.id)) + 1;
    const ord = ['', 'most', 'second most', 'third most', 'fourth most'][rank] || `#${rank}`;
    return [
      { p: `SupplyChain Optimiser usage fell **${pct(t.ut)} in the 14 days since v2.3** shipped on 31 Aug. The release added an approval step before stock transfers, and planners are skipping recommendations rather than approving them.` },
      { ul: [
        'Recommendations accepted: **62%**, down from 78% before v2.3.',
        `Value at stake: **${money(t.value * 3)} a quarter** — it's the ${ord} valuable tool in Operations.`,
        `Fix in flight: ${t.risk.mitigation} (${t.risk.owner}, due ${t.risk.due}).`,
      ] },
      { p: 'If the hotfix lands on time, expect usage to recover within two weeks. If it slips, the fastest lever is making the approval step optional for transfers under £5k.' },
    ];
  }

  aFallback(M) {
    return [
      { p: `I can answer questions about your ${M.running} tools — what they cost, what they return, who uses them, and what's waiting on you. Try one of these:` },
      { ask: ['Summarise this month for my board update', 'Which tools are slipping?', 'Which department returns the most per pound?'] },
    ];
  }

  suggestions(M) {
    const s = this.st();
    if (s.screen === 'project') { const t = M.byId[s.toolId]; if (t) return [`How is ${t.name} performing?`, `Has ${t.name} paid for itself?`, `What drives ${t.name}'s run cost?`]; }
    if (s.screen === 'projects') {
      const d = DEPTS.find((x) => x.id === s.f.dept);
      return d ? [`Total savings across ${d.name}`, `Which ${d.name} tools are slipping?`, `Top performers in ${d.name}`] : ['Top performers this month', 'Which tools are we barely using?', 'Where is the run cost going?'];
    }
    if (s.screen === 'departments') return ['Compare Finance and Operations', 'Which department returns the most per pound?', 'Which tools are slipping?'];
    if (s.screen === 'attention') return ['What should I deal with first?', 'Is Ledgerly worth saving?', 'HR Assistant rollout — worth it?'];
    return ['Summarise this month for my board update', 'Why is Ledgerly declining?', "What's waiting on my approval?"];
  }

  // ---------------- screen view-models ----------------
  filteredTools(M) {
    const s = this.st(), f = s.f;
    const rows = M.tools.filter((t) => (!f.dept || t.dept === f.dept) && (!f.status || t.status === f.status) && (!f.owner || t.owner === f.owner) && (!f.stage || t.stage === f.stage));
    const day = (u) => { const p = String(u).split(' '); return (MON.indexOf(p[1]) * 31) + (+p[0] || 0); };
    const cmp = {
      status: (a, b) => a.st.rank - b.st.rank || b.value - a.value,
      value: (a, b) => b.value - a.value, run: (a, b) => b.run - a.run, users: (a, b) => b.users - a.users,
      updated: (a, b) => day(b.updated) - day(a.updated), name: (a, b) => a.name.localeCompare(b.name), owner: (a, b) => a.owner.localeCompare(b.owner),
    }[s.sortKey] || ((a, b) => 0);
    return rows.slice().sort((a, b) => cmp(a, b) * s.sortDir);
  }

  vmHome(M) {
    const s = this.st(), T = M.total;
    const slipN = M.slipping.length, pendN = M.pending.length;
    const hr = new Date().getHours();
    const greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
    let headline;
    if (slipN) headline = `Your tools are mostly healthy —\nbut ${word(slipN)} need${slipN === 1 ? 's' : ''} you this week.`;
    else if (pendN) headline = `Your tools are healthy —\njust ${word(pendN)} approval${pendN > 1 ? 's' : ''} to clear.`;
    else headline = 'Your tools are healthy —\nnothing needs you this week.';
    const appr = pendN ? `${word(pendN)} approval${pendN > 1 ? 's are' : ' is'} sitting with you.` : 'nothing is waiting on your sign-off.';
    const sub2 = slipN ? `. ${cap(word(slipN))} ${slipN > 1 ? 'are' : 'is'} losing ground, and ${appr}` : `. ${cap(appr)}`;
    const oldest = M.pending.slice().sort((a, b) => b.age - a.age)[0];
    const healthy = M.running - slipN - M.idle.length;
    return {
      greet, headline, sub1: `${M.running - slipN} of ${M.running} are running fine and saved the company `, subStrong: `${money(T.value)} this month`, sub2,
      clearedTxt: `${2 + s.clearedSession} approval${2 + s.clearedSession === 1 ? '' : 's'}`,
      kpi: {
        value: money(T.value), valueTr: trend(T.vg, true), multiple: Math.round(T.value / T.run),
        users: usersShort(T.users), usersTr: trend(T.ug, true),
        paid: String(M.paid), running: `/ ${M.running}`, paidPct: `${((M.paid / M.running) * 100).toFixed(1)}%`, paidUp: M.paid - M.paidLast > 0 ? `▲ up from ${M.paidLast}` : `Same as`,
        waiting: String(pendN), waitStrong: oldest ? `Oldest ${oldest.age} days` : 'All clear', waitRest: oldest ? (oldest.blocking ? ' · blocking a rollout' : ' · nothing blocked') : ' · nothing waiting on you', waitColor: oldest ? '#b45309' : '#15803d',
      },
      issues: M.slipping.slice().sort((a, b) => (b.valuePrev - b.value) - (a.valuePrev - a.value)).map((t) => ({
        name: t.name, icon: ICONS[t.icon], color: t.color, pill: t.status === 'Concern' ? 'Concern' : t.status, pillBg: t.st.bg, pillFg: t.st.fg, edge: t.st.dot,
        line: `${t.issue.home} ${t.issue.tail.replace('{risk}', money(t.value * 3))}`,
        meta: `${t.deptName} · ${t.stage} · owned by ${t.owner}${t.issue.after ? ' · ' + t.issue.after : ''}`,
        hasRisk: !!t.risk, risk: t.risk ? `1 open risk · mitigation in place, owned by ${t.risk.owner.split(' ')[0]} (due ${t.risk.due})` : '',
        big: usersShort(t.users), bigColor: t.status === 'Concern' ? '#c81e1e' : '#b45309', trendTxt: `${trend(t.ut, true).arrow} ${pct(t.ut)} ${t.issue.window}`,
        ask: () => this.openPanel(`Why is ${t.name} declining?`), view: () => this.openTool(t.id),
      })),
      hasIssues: slipN > 0, noIssues: slipN === 0,
      approvals: M.pending.map((a) => ({
        tool: M.byId[a.tool].name, title: a.title, ageTxt: `Waiting ${a.age} day${a.age > 1 ? 's' : ''}${a.blocking ? ' · delaying launch' : ''}`,
        ageColor: a.blocking ? '#c81e1e' : '#64748b', review: () => this.openReview(a.id),
      })),
      hasApprovals: pendN > 0, noApprovals: pendN === 0, toClear: pendN ? `${pendN} to clear` : 'all clear',
      clearedA: s.clearedSession ? "You've cleared " : 'You cleared ',
      clearedStrong: s.clearedSession ? `${s.clearedSession} today` : '4 last week',
      clearedB: pendN ? ` · clearing these unblocks ${word(pendN)} team${pendN > 1 ? 's' : ''}.` : ' · every team is unblocked.',
      healthyStrong: `${healthy} tools are healthy`, healthyRest: ` and need nothing from you today${M.watched.length ? ` — owners are keeping an eye on ${word(M.watched.length)} of them` : ''}. `,
      idleLink: `${M.idle.length} more ${M.idle.length === 1 ? 'is' : 'are'} idle`, idleRest: ' but low-value — worth a glance when you have a spare moment. Enjoy the quiet.', hasIdle: M.idle.length > 0,
    };
  }

  vmProjects(M) {
    const s = this.st(), f = s.f;
    const rows = this.filteredTools(M);
    const A = this.agg(rows);
    const d = DEPTS.find((x) => x.id === f.dept);
    const parts = [];
    if (d) parts.push(`in ${d.name}`);
    if (f.status) parts.push(`· ${f.status}`);
    if (f.owner) parts.push(`· owned by ${f.owner}`);
    if (f.stage) parts.push(`· at ${f.stage}`);
    const any = !!(f.dept || f.status || f.owner || f.stage);
    const cols = 'minmax(210px, 2.2fr) 168px minmax(170px, 1.6fr) 70px 104px 92px 70px 20px';
    const head = [['name', 'Project / tool', 'flex-start'], ['status', 'Status', 'flex-start'], ['owner', 'Owner', 'flex-start'], ['users', 'Users', 'flex-end'], ['run', 'Run cost / mo', 'flex-end'], ['value', 'Value / mo', 'flex-end'], ['updated', 'Updated', 'flex-start']]
      .map(([key, label, justify]) => ({ label, justify, cls: key === 'updated' ? 'pt-upd' : '', arrow: s.sortKey === key ? (s.sortDir > 0 ? '▼' : '▲') : '', color: s.sortKey === key ? '#0f172a' : '#64748b', click: () => this.sortBy(key) }));
    const kTr = (x, up) => trend(x, up);
    return {
      f, hasFilter: any, bannerTitle: `Viewing ${rows.length} project${rows.length === 1 ? '' : 's'} ${parts.join(' ') || ''}`.trim(),
      bannerSub: d ? 'Every tool in the department — its status, cost and the value it returns.' : 'Every matching tool — its status, cost and the value it returns.',
      title: d ? d.name : 'All projects', countTxt: `${rows.length} project${rows.length === 1 ? '' : 's'}`,
      subtitle: d ? `All automation tools and agents owned by the ${d.name} department.` : 'Every automation tool and agent across the company.',
      tableTitle: d ? `${d.name} projects` : 'Projects',
      k: { users: usersShort(A.users), usersTr: kTr(A.ug, true), run: money(A.run), runTr: kTr(A.rg, false), invested: money(A.invested), value: money(A.value), valueTr: kTr(A.vg, true) },
      cols, head, sortKey: s.sortKey,
      rows: rows.map((t) => ({
        name: t.name, deptName: t.deptName, icon: ICONS[t.icon] || ICONS.sparkles, color: t.color, status: t.status, stBg: t.st.bg, stFg: t.st.fg, stDot: t.st.dot,
        owner: t.owner, ini: initials(t.owner), team: t.teamName, users: t.live ? usersShort(t.users) : '—',
        run: t.live ? money(t.run) : '—', runTr: t.live ? trend(t.ct, false) : { arrow: '', txt: 'not live', color: '#64748b' },
        value: t.live ? money(t.value) : '—', updated: t.updated, open: () => this.openTool(t.id),
      })),
      empty: rows.length === 0,
      deptChip: !!d, deptSelect: !d, deptName: d ? d.name : '',
      onDept: (e) => this.setFilter('dept', e.target.value), clearDept: () => this.setFilter('dept', ''),
      onStatus: (e) => this.setFilter('status', e.target.value), onOwner: (e) => this.setFilter('owner', e.target.value), onStage: (e) => this.setFilter('stage', e.target.value),
      onSort: (e) => this.setState({ sortKey: e.target.value, sortDir: 1 }),
      clearAll: () => this.clearFilters(),
      exportCsv: () => this.exportCsv(), add: () => this.setState({ modal: { type: 'add' } }), users: () => this.setState({ modal: { type: 'users' } }),
    };
  }

  vmProject(M) {
    const s = this.st();
    const t = M.byId[s.toolId] || M.byId.invoicebot;
    const c = t.c, p = this.payback(t);
    const backLabels = { home: 'Back to overview', projects: 'Back to all projects', departments: 'Back to departments', attention: 'Back to needs attention', ask: 'Back to Ask Verdict', settings: 'Back to settings' };
    const meta = [
      { label: 'Department', value: t.deptName, icon: ICONS.building },
      { label: 'Owner', value: t.owner, icon: ICONS.user },
      { label: 'Launched', value: t.live ? mlab(c.start, true) : 'Not yet', icon: ICONS.calendar },
      { label: 'Version', value: t.version, icon: ICONS.workflow },
      { label: 'Team', value: `${t.teamName} · ${t.crew}`, icon: ICONS.users },
      { label: 'Runs on', value: t.runsOn, icon: ICONS.monitor },
    ];
    // verdict banner
    const tone = { green: { bg: '#eef8f2', border: '#c6e6d2', edge: '#16a34a', strong: '#15803d' }, red: { bg: '#fdf1f1', border: '#f5cfcf', edge: '#dc2626', strong: '#b91c1c' },
      amber: { bg: '#fdf7ea', border: '#f1dfb3', edge: '#d97706', strong: '#9a5b05' }, blue: { bg: '#eff4fe', border: '#cddcfb', edge: '#2563eb', strong: '#1d4ed8' }, gray: { bg: '#f4f6f9', border: '#e2e7ee', edge: '#64748b', strong: '#334155' } };
    let vb;
    if (!t.live) vb = Object.assign({ title: `${t.name} is planned.`, text: p.months ? `No usage yet. At the estimates you gave (${money(t.estValue)} value vs ${money(t.estRun)} to run each month) a ${money(t.build)} build would pay back in about ${p.months} months.` : 'No usage yet — Verdict starts tracking value as soon as it goes live.' }, tone.blue);
    else if (t.slipping) vb = Object.assign({ title: `${t.name} is losing ground.`, text: t.issue.page.replace('{risk}', money(t.value * 3)) }, t.status === 'Concern' ? tone.red : tone.amber);
    else if (t.status === 'Idle') vb = Object.assign({ title: `${t.name} is barely used.`, text: `${commas(t.users)} people used it this month. It returns ${money(t.value)}/mo against ${money(t.run)}/mo to run, and hasn't paid back its ${money(t.build)} build.` }, tone.gray);
